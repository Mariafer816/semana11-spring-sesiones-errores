<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar Aula</title>
    <link rel="stylesheet" th:href="@{/css/mejoras.css}">

    <link rel="stylesheet" th:href="@{/css/formulario.css}">
</head>

<body>

<header class="encabezado">

    <h1>Sistema de Reservas de Aulas</h1>

    <p>Registro de nuevas aulas</p>

</header>

<nav th:replace="~{fragments/componentes :: menu('aulas')}"></nav>

<main class="contenedor">

    <section class="formulario">

        <h2 th:text="${aula.id != null} ? 'Editar Aula' : 'Registrar Aula'">Registrar Aula</h2>

        <form
                th:action="@{/aulas/guardar}"
                th:object="${aula}"
                method="post"
                novalidate>

            <!-- ID oculto: permite que al editar se actualice el aula en lugar de crear otra -->
            <input type="hidden" th:field="*{id}">

            <!-- Nombre -->
            <div class="campo">

                <label for="nombre">
                    Nombre del aula
                </label>

                <input
                        type="text"
                        id="nombre"
                        th:field="*{nombre}"
                        placeholder="Ejemplo: Aula 101">

                <span
                        class="error"
                        th:if="${#fields.hasErrors('nombre')}"
                        th:errors="*{nombre}">
                </span>

            </div>

            <!-- Capacidad -->
            <div class="campo">

                <label for="capacidad">
                    Capacidad
                </label>

                <input
                        type="number"
                        id="capacidad"
                        th:field="*{capacidad}"
                        min="1"
                        max="500"
                        placeholder="Ejemplo: 30">

                <span
                        class="error"
                        th:if="${#fields.hasErrors('capacidad')}"
                        th:errors="*{capacidad}">
                </span>

            </div>

            <!-- Ubicación -->
            <div class="campo">

                <label for="ubicacion">
                    Ubicación
                </label>

                <input
                        type="text"
                        id="ubicacion"
                        th:field="*{ubicacion}"
                        placeholder="Ejemplo: Bloque A - Segundo piso">

                <span
                        class="error"
                        th:if="${#fields.hasErrors('ubicacion')}"
                        th:errors="*{ubicacion}">
                </span>

            </div>

            <!-- Tipo -->
            <div class="campo">

                <label for="tipo">
                    Tipo de aula
                </label>

                <select
                        id="tipo"
                        th:field="*{tipo}">

                    <option value="">
                        Seleccione un tipo
                    </option>

                    <option value="Aula convencional">
                        Aula convencional
                    </option>

                    <option value="Laboratorio">
                        Laboratorio
                    </option>

                    <option value="Sala de informática">
                        Sala de informática
                    </option>

                    <option value="Auditorio">
                        Auditorio
                    </option>

                </select>

                <span
                        class="error"
                        th:if="${#fields.hasErrors('tipo')}"
                        th:errors="*{tipo}">
                </span>

            </div>

            <!-- Disponible -->
            <div class="campo">

                <label for="disponible">
                    Disponibilidad
                </label>

                <select
                        id="disponible"
                        th:field="*{disponible}">

                    <option value="true">
                        Disponible
                    </option>

                    <option value="false">
                        No disponible
                    </option>

                </select>

            </div>

            <!-- Botones -->
            <div class="botones">

                <button
                        type="submit"
                        class="btn guardar">
                    Guardar Aula
                </button>

                <a
                        th:href="@{/aulas}"
                        class="btn cancelar">
                    Cancelar
                </a>

            </div>

        </form>

    </section>

</main>

</body>

</html>
