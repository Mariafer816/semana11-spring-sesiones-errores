<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | Sistema de Reservas</title>
    <link rel="stylesheet" th:href="@{/css/mejoras.css}">
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:if="${tema == 'oscuro'}" th:href="@{/css/tema-oscuro.css}">
</head>

<body>

<header class="encabezado">
    <h1>Sistema de Reservas de Aulas</h1>
    <p>Crear cuenta de acceso</p>
</header>

<main class="contenedor contenedor-auth">

    <section class="formulario">

        <h2>Crear cuenta</h2>

        <p class="aviso">
            Si su correo ya está registrado en el sistema pero aún no tiene contraseña,
            escríbalo aquí y cree su contraseña de acceso.
        </p>

        <!-- novalidate: se muestra la validación del servidor (@Valid) -->
        <form th:action="@{/registro}" th:object="${registroForm}" method="post" novalidate>

            <div class="campo">
                <label for="nombre">Nombre completo</label>
                <input type="text"
                       id="nombre"
                       th:field="*{nombre}"
                       autocomplete="name"
                       placeholder="Ejemplo: Carlos Pérez">
                <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
            </div>

            <div class="campo">
                <label for="correo">Correo electrónico</label>
                <input type="text"
                       id="correo"
                       th:field="*{correo}"
                       autocomplete="username"
                       placeholder="Ejemplo: nombre@etitc.edu.co">
                <span class="error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></span>
            </div>

            <div class="campo">
                <label for="rol">Rol</label>
                <select id="rol" th:field="*{rol}">
                    <option value="">Seleccione un rol</option>
                    <option value="DOCENTE">Docente</option>
                    <option value="ESTUDIANTE">Estudiante</option>
                    <option value="ADMINISTRATIVO">Administrativo</option>
                </select>
                <span class="error" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"></span>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password"
                       id="password"
                       th:field="*{password}"
                       autocomplete="new-password">
                <span class="ayuda">Mínimo 8 caracteres, con al menos una letra y un número.</span>
                <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>

            <div class="campo">
                <label for="confirmarPassword">Confirmar contraseña</label>
                <input type="password"
                       id="confirmarPassword"
                       th:field="*{confirmarPassword}"
                       autocomplete="new-password">
                <span class="error" th:if="${#fields.hasErrors('confirmarPassword')}" th:errors="*{confirmarPassword}"></span>
            </div>

            <div class="botones">
                <button type="submit" class="btn guardar btn-bloque">Crear cuenta</button>
            </div>

        </form>

        <div class="auth-separador"><span>¿Ya tiene cuenta?</span></div>

        <a th:href="@{/login}" class="btn cancelar btn-bloque btn-enlace">Volver a iniciar sesión</a>

    </section>

</main>

</body>

</html>
