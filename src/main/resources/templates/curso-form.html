<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${cursoId != null} ? 'Editar Curso' : 'Nuevo Curso'">Formulario</title>
    <link rel="stylesheet" th:href="@{/css/mejoras.css}">

    <link rel="stylesheet" th:href="@{/css/formulario.css}">
</head>

<body>

<header class="encabezado">

    <h1>Sistema de Reservas de Aulas</h1>

    <p>Gestión de cursos</p>

</header>

<nav th:replace="~{fragments/componentes :: menu('cursos')}"></nav>

<main class="contenedor">

    <section class="formulario">

        <h2 th:text="${cursoId != null} ? 'Editar Curso' : 'Registrar Curso'">Registrar Curso</h2>

        <form th:action="${cursoId != null} ? @{/cursos/{id}/actualizar(id=${cursoId})} : @{/cursos}"
              th:object="${cursoForm}"
              method="post"
              novalidate>

            <div class="campo">
                <label for="nombre">Nombre del curso</label>

                <input type="text"
                       id="nombre"
                       th:field="*{nombre}"
                       th:classappend="${#fields.hasErrors('nombre')} ? 'invalido'"
                       placeholder="Ejemplo: Programación Web">

                <span class="error"
                      th:if="${#fields.hasErrors('nombre')}"
                      th:errors="*{nombre}"></span>
            </div>

            <div class="campo">
                <label for="horas">Horas</label>

                <input type="number"
                       id="horas"
                       th:field="*{horas}"
                       th:classappend="${#fields.hasErrors('horas')} ? 'invalido'"
                       min="1"
                       placeholder="Ejemplo: 48">

                <span class="error"
                      th:if="${#fields.hasErrors('horas')}"
                      th:errors="*{horas}"></span>
            </div>

            <div class="botones">
                <button type="submit" class="btn guardar">Guardar curso</button>
                <a th:href="@{/cursos}" class="btn cancelar">Cancelar</a>
            </div>

        </form>

    </section>

</main>

</body>

</html>
