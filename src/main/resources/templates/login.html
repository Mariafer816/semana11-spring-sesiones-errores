<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Sistema de Reservas</title>
    <link rel="stylesheet" th:href="@{/css/mejoras.css}">
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:if="${tema == 'oscuro'}" th:href="@{/css/tema-oscuro.css}">
</head>

<body>

<header class="encabezado">
    <h1>Sistema de Reservas de Aulas</h1>
    <p>Inicie sesión para continuar</p>
</header>

<main class="contenedor contenedor-auth">

    <section class="formulario">

        <h2>Iniciar sesión</h2>

        <!-- Mensaje al llegar desde el registro ("mensaje") -->
        <div th:replace="~{fragments/componentes :: alertas}"></div>

        <div class="alerta alerta-error" th:if="${loginError}">
            Correo o contraseña incorrectos. Si todavía no ha creado su contraseña,
            use <a th:href="@{/registro}">Crear cuenta</a> con su mismo correo.
        </div>
        <div class="alerta alerta-exito" th:if="${sesionCerrada}">
            Cerró sesión correctamente.
        </div>

        <form th:action="@{/login}" method="post">

            <div class="campo">
                <label for="correo">Correo electrónico</label>
                <input type="email"
                       id="correo"
                       name="correo"
                       autocomplete="username"
                       placeholder="nombre@etitc.edu.co"
                       required
                       autofocus>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password"
                       id="password"
                       name="password"
                       autocomplete="current-password"
                       required>
            </div>

            <div class="botones">
                <button type="submit" class="btn guardar btn-bloque">Ingresar</button>
            </div>

        </form>

        <div class="auth-separador"><span>¿Aún no tiene cuenta?</span></div>

        <!-- Botón hacia el registro: crea la cuenta y deja la sesión iniciada -->
        <a th:href="@{/registro}" class="btn cancelar btn-bloque btn-enlace">Crear cuenta nueva</a>

    </section>

</main>

</body>

</html>
