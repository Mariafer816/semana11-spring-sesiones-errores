# Mensajes de error cuando el dato escrito no se puede convertir al tipo esperado
# (por ejemplo texto donde se esperaba un número o una fecha).
typeMismatch=El valor ingresado no es válido
typeMismatch.java.lang.Integer=Debe ingresar un número entero válido
typeMismatch.java.lang.Long=Debe seleccionar una opción válida
typeMismatch.java.time.LocalDate=La fecha no tiene un formato válido (aaaa-mm-dd)
typeMismatch.java.time.LocalTime=La hora no tiene un formato válido (hh:mm)
