# ==========================================================
# APLICACIÓN
# ==========================================================
spring.application.name=ReservasAulas
server.port=8080

# ==========================================================
# BASE DE DATOS SQL (por defecto: H2 guardada en un ARCHIVO)
# - No requiere instalar nada: la aplicación arranca en cualquier computador.
# - Los datos SE CONSERVAN entre ejecuciones (carpeta ./data del proyecto).
# - Para usar MySQL en lugar de H2:  perfil "mysql"  (ver application-mysql.properties y el README).
# - También se puede cambiar con las variables de entorno DB_URL, DB_USERNAME y DB_PASSWORD.
# ==========================================================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/reservas_aulas}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# ==========================================================
# JPA / HIBERNATE
# update: crea o completa las tablas al arrancar (database/schema.sql es el equivalente manual)
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================================
# SESIÓN Y COOKIES
# La sesión (HttpSession) vive en el servidor; el navegador solo guarda la cookie JSESSIONID con su identificador.
# ==========================================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ==========================================================
# PÁGINAS DE ERROR (templates/error/404.html, 500.html y templates/error.html)
# Nunca se muestran mensajes internos ni trazas de error al usuario.
# ==========================================================
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ==========================================================
# LOGGING
# ==========================================================
logging.level.com.etitc.fundamentos=DEBUG
