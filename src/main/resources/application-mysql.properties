# Perfil "mysql": usa MySQL en lugar de H2.
# Requisito: MySQL encendido en el puerto 3306 (por ejemplo desde XAMPP).
# Uso en IntelliJ: Run > Edit Configurations > Active profiles = mysql
# Uso por consola: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# createDatabaseIfNotExist=true crea la base "reservas_aulas" si no existe.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reservas_aulas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
